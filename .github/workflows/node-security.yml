name: Node security image

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build patched runtime
        run: docker build -t node-security -f Dockerfile  .
      - name: Check runtime version and Brotli roundtrip
        run: >-
          docker run --rm --network none --entrypoint node node-security -e
          "const assert=require('node:assert/strict'),z=require('node:zlib');assert.equal(process.versions.node,'22.23.4');const input=Buffer.from('security smoke');assert.deepEqual(z.brotliDecompressSync(z.brotliCompressSync(input)),input);console.log(process.versions.node);"
